# Builds ProjectManagerApp and publishes it to GitHub Pages:
# https://hassanscp112.github.io/ProjectManagPro/
# Runs on every push to main (and by hand). Pages must be set once in the
# repository: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProjectManagerApp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ProjectManagerApp/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Build for /ProjectManagPro/
        run: npm run build
        env:
          VITE_BASE: /ProjectManagPro/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ProjectManagerApp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
